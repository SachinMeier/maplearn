<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101720">
  <meta name="description" content="Learn the world, one place at a time.">
  <title>Maps</title>
  <link rel="canonical" href="https://maps.pirategames.org/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Maps">
  <meta property="og:title" content="Maps — Learn the world">
  <meta property="og:description" content="Learn the world, one place at a time.">
  <meta property="og:url" content="https://maps.pirategames.org/">
  <meta property="og:image" content="https://maps.pirategames.org/assets/social/world.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A stylized world map with tan land, bold country borders, and a dark blue ocean.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Maps — Learn the world">
  <meta name="twitter:description" content="Learn the world, one place at a time.">
  <meta name="twitter:image" content="https://maps.pirategames.org/assets/social/world.png">
  <meta name="twitter:image:alt" content="A stylized world map with tan land, bold country borders, and a dark blue ocean.">
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="assets/globe.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicons/icon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/favicons/icon-180.png" sizes="180x180">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="icon-symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <symbol id="icon-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18M5 6.5c4 2 10 2 14 0M5 17.5c4-2 10-2 14 0"/></symbol>
  <symbol id="icon-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m16 8-2.5 5.5L8 16l2.5-5.5Z"/></symbol>
  <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="icon-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4 10 14M10 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5"/></symbol>
  <symbol id="icon-menu" viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></symbol>
  <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></symbol>
  <symbol id="icon-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="icon-fit" viewBox="0 0 24 24"><path d="M9 4H4v5M15 4h5v5M4 15v5h5M20 15v5h-5"/></symbol>
  <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
</svg>
  <main id="home" class="home">
    <header class="home-header"><svg class="brand-icon" aria-hidden="true"><use href="#icon-globe"/></svg><h1>Maps</h1></header>
    <p id="offline-help" class="offline-help"></p>
    <div id="world-options" class="region-options"></div>
    <section aria-labelledby="continents-title">
      <h2 id="continents-title" class="section-label">Continents</h2>
      <div id="continents-options" class="region-options"></div>
    </section>
    <section aria-labelledby="us-title">
      <h2 id="us-title" class="section-label">US</h2>
      <div id="us-options" class="region-options"></div>
    </section>
    <section aria-labelledby="other-title">
      <h2 id="other-title" class="section-label">Other</h2>
      <div id="other-options" class="region-options">
        <a class="map-download-card geolearn-card" href="https://gquiz.pirategames.org" target="_blank" rel="noopener noreferrer">
          <span class="map-card">
            <span class="thumbnail"><svg aria-hidden="true"><use href="#icon-compass"/></svg></span>
            <span class="card-name">GeoLearn</span>
            <svg class="arrow" aria-hidden="true"><use href="#icon-external"/></svg>
          </span>
          <span class="map-download"><span class="download-status">More geography trivia</span></span>
        </a>
      </div>
    </section>
  </main>

  <section id="game" class="game" aria-label="World map game" hidden>
    <div id="map-surface" class="map-surface" aria-label="Interactive map"></div>
    <div class="game-topbar">
      <button id="country-pill" class="country-pill" title="Reveal country" aria-describedby="reveal-hint" disabled>
        <span id="country-name">Loading…</span><span id="progress" class="progress">0 / 0</span>
      </button>
      <span id="reveal-hint" class="sr-only">Reveal and check off the current country.</span>
      <button id="menu-button" class="icon-button menu-button" aria-label="Open menu" aria-haspopup="dialog" aria-controls="menu-dialog"><svg aria-hidden="true"><use href="#icon-menu"/></svg></button>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
    <p id="map-note" class="map-note">Placeholder map</p>
    <div id="load-error" class="load-error" hidden><p>Couldn’t load the map.</p><button id="reload-button" class="button">Try again</button><a href="#/" class="button subtle">Home</a></div>
    <span id="game-announcement" class="sr-only" aria-live="polite" aria-atomic="true"></span>
  </section>

  <dialog id="setup-dialog" class="modal" aria-labelledby="setup-title">
    <button class="close-button icon-button" data-close="setup-dialog" aria-label="Close"><svg aria-hidden="true"><use href="#icon-close"/></svg></button>
    <h2 id="setup-title">Include microstates?</h2>
    <div class="dialog-actions"><button id="without-microstates" class="button danger">No</button><button id="with-microstates" class="button success" autofocus>Yes</button></div>
  </dialog>

  <dialog id="menu-dialog" class="modal menu-dialog" aria-labelledby="menu-title">
    <div class="dialog-heading"><h2 id="menu-title">World</h2><button class="icon-button" data-close="menu-dialog" aria-label="Close menu"><svg aria-hidden="true"><use href="#icon-close"/></svg></button></div>
    <div class="menu-scores"><span>✅ <span id="menu-correct">0</span></span><span>❌ <span id="menu-incorrect">0</span></span><span>🏳️ <span id="menu-reveals">0</span></span></div>
    <nav class="menu-actions" aria-label="Game"><button id="menu-reveal">Reveal</button><button id="menu-reveal-all">Reveal all</button><a href="#/">Home</a></nav>
  </dialog>

  <dialog id="complete-dialog" class="modal complete-dialog" aria-labelledby="complete-title">
    <button id="complete-close" class="close-button icon-button" aria-label="Close completion"><svg aria-hidden="true"><use href="#icon-close"/></svg></button>
    <div class="completion-icon" aria-hidden="true">✓</div><h2 id="complete-title">Congratulations</h2>
    <dl class="final-scores"><div><dt>✅ Correct</dt><dd id="final-correct">0</dd></div><div><dt>❌ Incorrect</dt><dd id="final-incorrect">0</dd></div><div><dt>🏳️ Reveals</dt><dd id="final-reveals">0</dd></div></dl>
    <div class="dialog-actions"><a href="#/" class="button subtle">Home</a><button id="retry-button" class="button success" autofocus>Retry</button></div>
  </dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
